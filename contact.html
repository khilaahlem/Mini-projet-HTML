    <header>
        <h1>Nous contacter</h1>
        <nav>

        <img src="img/restaurant-interieur.jpg" alt="photo du restaurant le Fisco" width="500" height="350">

    <section>
        <h2>Où nous trouver </h2>
        <p>
            128 rue de démonstration
            34000 Montpellier<br>
            France
        </p>
            <iframe src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d23108.783004483143!2d3.8621703531905482!3d43.61491372141261!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x12b6af7310576d39%3A0x258d3fac6cb5431a!2sLe%20Boudoir%20Montpelli%C3%A9rain!5e0!3m2!1sfr!2stn!4v1766619865206!5m2!1sfr!2stn" width="1000" height="300" style="border:0;" allowfullscreen="" loading="lazy" referrerpolicy="no-referrer-when-downgrade"></iframe>

            <h2>Nous envoyer un email</h2>
            <form action="contact.html">
                <div>
                    <label for="email">Votre email <sup>*</sup></label>
                    <input type="email" required id="email" name="email" placeholder="votre@gmail.fr">
                </div>
                <div>
                    <label for="firstname">Votre prenom <sup>*</sup></label>
                    <input type="text" required id="firstname" name="firstname">
                </div>
                    <div>
                    <label for="message">Votre message <sup>*</sup></label>
                    <textarea required id="message" name="message"></textarea>
                </div>
                <button type="submit">envoyer votre email</button>
            </form>
    </section>
    <footer>
        <address>128 rue de démonstration</address>
    </footer>
